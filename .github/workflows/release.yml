name: release

# A v* tag tests, builds halfsay.app on a macOS runner and publishes the release: a dmg to drag into Applications,
# the same app zipped, and notes grouped by commit type. A manual run only builds them and keeps them as an artifact.
# Not notarized yet: that needs an Apple Developer ID (see the Prometeu workflow for the signing secrets it takes).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the notes need the commits and tags since the last release

      - name: Use the newest stable Xcode on the runner (the bar's glass needs the macOS 26 SDK)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          swift --version

      - name: Test
        run: make test

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Sources/halfsay/Info.plist

      - name: Build the app
        run: make app

      # Fixed names, so the README can link releases/latest/download/halfsay-macos-arm64.dmg.
      - name: Pack a dmg and a zip
        run: |
          mkdir dmg && ditto build/halfsay.app dmg/halfsay.app && ln -s /Applications dmg/Applications
          hdiutil create -volname halfsay -srcfolder dmg -format UDZO halfsay-macos-arm64.dmg
          ditto -c -k --keepParent build/halfsay.app halfsay-macos-arm64.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" halfsay-macos-arm64.dmg halfsay-macos-arm64.zip \
            --title "${GITHUB_REF_NAME#v}" --notes-file notes.md

      - name: Keep them (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: halfsay-macos-arm64
          path: halfsay-macos-arm64.*
