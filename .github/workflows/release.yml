name: release

# A v* tag tests, builds halfsay.app on a macOS runner and opens a draft release with the zip, for review before
# publishing. A manual run only builds it and keeps the zip as a workflow artifact.
# Not notarized yet: that needs an Apple Developer ID (see the Prometeu workflow for the signing secrets it takes).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest stable Xcode on the runner (the bar's glass needs the macOS 26 SDK)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          swift --version

      - name: Test
        run: make test

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Sources/halfsay/Info.plist

      - name: Build the app
        run: make app

      - name: Zip it
        run: ditto -c -k --keepParent build/halfsay.app "halfsay-${GITHUB_REF_NAME}-macos-arm64.zip"

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" halfsay-*.zip --draft --title "halfsay $GITHUB_REF_NAME" --generate-notes

      - name: Keep the zip (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: halfsay-macos-arm64
          path: halfsay-*.zip
