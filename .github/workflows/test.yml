name: test

# Every push to main and every pull request runs the offline tests, so a change that breaks the decision logic
# shows up before a release does. Read-only: a pull request from a fork gets no secrets and cannot write.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest stable Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"

      - name: Test
        run: make test
