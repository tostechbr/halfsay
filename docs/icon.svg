<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- halfsay: half a speech bubble said, the other half only dashed -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <clipPath id="said"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="unsaid"><rect x="532" y="0" width="492" height="1024"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#ffd60a" filter="url(#shadow)"/>
  <g clip-path="url(#said)" fill="#1d1d1f">
    <rect x="232" y="312" width="560" height="360" rx="180"/>
    <path d="M336 622 L286 756 L438 658 Z"/>
  </g>
  <g clip-path="url(#unsaid)">
    <rect x="246" y="326" width="532" height="332" rx="166" fill="none" stroke="#1d1d1f" stroke-width="28" stroke-dasharray="54 40" stroke-linecap="round"/>
  </g>
</svg>
